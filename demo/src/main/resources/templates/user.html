<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:40px;
            background:#f5f5f5;
        }

        h2{
            text-align:center;
        }

        .container{
            width:70%;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            box-sizing:border-box;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table, th, td{
            border:1px solid black;
        }

        th{
            background:#007bff;
            color:white;
        }

        th, td{
            padding:10px;
            text-align:center;
        }

        .delete{
            background:red;
        }

        .update{
            background:green;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>User Management System</h2>

    <!-- Add User Form -->
    <form th:action="@{/users}" th:object="${user}" method="post">

        <input type="text"
               th:field="*{name}"
               placeholder="Enter Name"
               required>

        <input type="text"
               th:field="*{address}"
               placeholder="Enter Address"
               required>

        <input type="text"
               th:field="*{college}"
               placeholder="Enter College"
               required>

        <button type="submit">Save User</button>

    </form>

    <hr>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>College</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="user : ${users}">

            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.address}"></td>
            <td th:text="${user.college}"></td>

            <td>

                <a th:href="@{/users/edit/{id}(id=${user.id})}">
                    <button class="update" type="button">Edit</button>
                </a>

                <a th:href="@{/users/delete/{id}(id=${user.id})}">
                    <button class="delete" type="button">Delete</button>
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
